[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mutual-fund-analyzer"
version = "0.1.0"
description = "Production-grade stateless Indian Mutual Fund Evaluation Agent powered by Gemini and in-memory quantitative analytics"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "google-genai>=2.30.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.2",
    "beautifulsoup4>=4.12.3",
    "pandas>=2.2.3",
    "numpy>=2.1.0",
    "scipy>=1.14.1",
    "yfinance>=0.2.48",
    "cachetools>=5.5.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"


